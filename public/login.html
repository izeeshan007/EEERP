<!DOCTYPE html>
<html lang="en">
<head>
    <title>Perfume ERP PRO | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/mobile.css">
</head>
<body class="bg-[#090a08] flex items-center justify-center min-h-screen px-4 py-6 font-['Inter']">

    <form id="erp-login-form" onsubmit="login(event)" class="bg-[#11130f] p-8 rounded-[2rem] shadow-2xl shadow-black/40 w-full max-w-md border border-yellow-600/50">
        <div class="text-center mb-8">
            <div class="inline-block bg-black p-3 rounded-2xl mb-4 shadow-lg shadow-yellow-900/20 border border-yellow-500">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
            </div>
            <h2 class="text-3xl font-black text-white tracking-tight">Welcome Back</h2>
            <p class="text-gray-400 font-medium mt-1">Perfume ERP PRO Management</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase ml-1 mb-2">Username</label>
                <input id="username" autocomplete="username" required class="w-full p-4 border border-gray-700 rounded-2xl bg-black/30 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition" placeholder="Enter your username">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase ml-1 mb-2">Password</label>
                <input id="password" type="password" autocomplete="current-password" required class="w-full p-4 border border-gray-700 rounded-2xl bg-black/30 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-yellow-500 hover:bg-white text-black font-bold py-4 rounded-2xl shadow-xl shadow-yellow-900/20 transition-all transform hover:-translate-y-0.5 active:scale-95 mt-4">
                Sign In
            </button>
        </div>

        <p id="msg" role="status" aria-live="polite" class="text-red-400 mt-6 text-center font-medium text-sm"></p>
        
        <div class="mt-8 pt-8 border-t border-gray-800 text-center">
            <p class="text-gray-500 text-xs font-medium">Restricted Access System</p>
        </div>
    </form>

<script>
    async function login(event){
        event?.preventDefault();
        const msg = document.getElementById('msg');
        msg.innerText = "Signing in...";
        try {
            const r = await fetch("/api/login",{
                method:"POST",
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                    username:document.getElementById('username').value,
                    password:document.getElementById('password').value
                })
            });
            const contentType = r.headers.get('content-type') || '';
            const d = contentType.includes('application/json') ? await r.json() : { success:false, message:`Server returned ${r.status} instead of JSON.` };
            if(r.ok && d.success){
                window.location.href="/";
            } else {
                msg.innerText = d.message || "Invalid credentials. Please try again.";
            }
        } catch (error) {
            msg.innerText = "Could not contact EEERP. Check the Render service logs and environment variables.";
        }
    }
</script>
</body>
</html>
